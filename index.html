<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOAT INSIGHT PRO | 検証</title><style>body{background:#071a2b;color:white;font:16px system-ui;padding:18px}main{max-width:780px;margin:auto}.card{background:#143047;border-radius:14px;padding:18px;margin:15px 0}strong{font-size:28px;color:#73ddff}a{color:#73ddff}.btn{display:block;background:#137bc7;color:white;padding:15px;border-radius:12px;text-align:center;text-decoration:none;font-weight:bold}small{color:#b9cbd6}body{background:radial-gradient(ellipse at 75% 0%,#15518c,transparent 48%),linear-gradient(135deg,#030b1b,#081d3d);color:#edf7ff}.card{background:linear-gradient(135deg,#12325c,#0a1e3b);border:1px solid #2b5483;box-shadow:0 12px 32px #0004}strong,a{color:#63d1ff}.btn{background:linear-gradient(110deg,#35c7ff,#226fe0);color:#06152b;box-shadow:0 5px 22px #078cff44}.btn:hover{filter:brightness(1.12)}small{color:#acc4de}</style><main><h1>🚤 BOAT INSIGHT PRO</h1><p>学習モデル・独立検証・展開CG</p><a class="btn" href="live.html">レース予想・旋回CG・オッズ自動確認を開く</a><div class="card" id="status">検証レポート確認中…</div><div id="metrics"></div><div class="card"><b>検証の条件</b><p>時系列で学習60%・調整20%・未使用テスト20%。3連単6点を各100円で全レース購入した仮定。確定払戻での評価であり、購入時オッズ・締切時刻の再現ではありません。</p><p><a href="backtest.csv">検証レース別CSV</a> / <a href="predictions.json">学習済み予測JSON</a></p><small>レポートがなければ成績は未検証。モデル確率は校正済み1着確率からの近似です。</small></div></main><script>fetch('report.json?'+Date.now()).then(r=>{if(!r.ok)throw Error('レポートなし');return r.json()}).then(d=>{document.getElementById('status').textContent='未使用テスト：'+d.test_dates.join(' ～ ')+'／'+d.test.races+'レース';document.getElementById('metrics').innerHTML=[['6点的中率',d.test.hit_rate_pct+'%'],['回収率',d.test.roi_pct+'%'],['購入総額',d.test.stake_yen.toLocaleString()+'円'],['払戻合計',d.test.returns_yen.toLocaleString()+'円']].map(x=>'<div class="card">'+x[0]+'<p><strong>'+x[1]+'</strong></p></div>').join('')}).catch(()=>document.getElementById('status').textContent='実データでの学習・検証は未完了。GitHub Actionsのログで取得状況を確認してください。')</script></html>
